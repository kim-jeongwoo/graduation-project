<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 — Vocal Fit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; }
        .login-card {
            max-width: 420px; margin: 0 auto;
            background: #16213e; border: none; border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,.3);
        }
        .login-card .card-body { padding: 36px 32px; }
        .login-card h3 { color: #a0c4ff; font-weight: 600; }
        .login-card .form-label { color: #b0c4d8; font-size: .9rem; }
        .login-card .form-control {
            background: #1a1a2e; border: 1px solid #2a3550; color: #e0e0e0;
        }
        .login-card .form-control:focus {
            background: #1a1a2e; border-color: #a0c4ff; color: #fff;
            box-shadow: 0 0 0 .2rem rgba(160,196,255,.15);
        }
        .login-card .btn-primary { background: #4f7df0; border: none; padding: 10px; font-weight: 600; }
        .login-card .btn-primary:hover { background: #3a68d8; }
        .footer-note { color: #6b7b8d; font-size: .8rem; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card">
            <div class="card-body">
                <h3 class="text-center mb-4">🎤 관리자 로그인</h3>

                {% if error == "invalid_password" %}
                <div class="alert alert-danger" role="alert">비밀번호가 일치하지 않습니다.</div>
                {% elif error == "rate_limited" %}
                <div class="alert alert-warning" role="alert">
                    로그인 시도가 너무 많습니다. {% if retry %}{{ retry }}초 후{% else %}잠시 후{% endif %} 다시 시도해주세요.
                </div>
                {% endif %}

                <form method="POST" action="/admin/login">
                    <div class="mb-3">
                        <label class="form-label">비밀번호</label>
                        <input type="password" name="password" class="form-control" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">로그인</button>
                </form>
                <p class="footer-note">Vocal Fit Admin · 세션 24시간 유지</p>
            </div>
        </div>
    </div>
</body>
</html>
